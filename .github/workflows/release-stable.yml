name: Release (Stable)

# A release is published only once every profile's image is built and
# SHA256SUMS is signed: devices follow releases/latest/download/, so a Latest
# release without them would be offered half-made.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to cut, with or without leading v (e.g. 0.2.0)"
        required: true
        type: string
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  cut:
    name: Cut release (dispatch)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.validate.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 0

      - name: Validate version
        id: validate
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="${INPUT_VERSION#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must be semver X.Y.Z (got '$INPUT_VERSION')"; exit 1
          fi
          # Stable tags only: sort -V ranks v1.0.0-rc.1 above v1.0.0.
          latest="$(git tag --list 'v[0-9]*' --sort=-v:refname | grep -v -- - | head -n1)"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "::error::Tag v$version already exists"; exit 1
          fi
          if ! [ "$(printf '%s\n' "$latest" "v$version" | sort -V | tail -n1)" = "v$version" ] \
             || [ "$latest" = "v$version" ]; then
            echo "::error::v$version must be greater than latest tag ${latest:-<none>}"; exit 1
          fi
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      # A tag pushed with GITHUB_TOKEN starts no workflow: this run goes on to build it.
      - name: Tag master HEAD
        env:
          TAG: ${{ steps.validate.outputs.tag }}
        run: |
          git tag "$TAG"
          git push origin "$TAG"

  prepare:
    name: Tag and profiles
    needs: cut
    # cut is skipped on a tag push; a skipped need would skip this job too.
    if: ${{ !cancelled() && (github.event_name == 'push' || needs.cut.result == 'success') }}
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      profiles: ${{ steps.profiles.outputs.profiles }}
    steps:
      - id: tag
        env:
          TAG: ${{ needs.cut.outputs.tag || github.ref_name }}
        run: echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.tag.outputs.tag }}

      # Every profile under hw/ ships; the image-profiles check builds them all.
      - id: profiles
        run: echo "profiles=$(find hw -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort | jq -Rsc 'split("\n")[:-1]')" >> "$GITHUB_OUTPUT"

  images:
    name: Image (${{ matrix.profile }})
    needs: prepare
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        profile: ${{ fromJSON(needs.prepare.outputs.profiles) }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      # image.repart runs systemd-repart under unshare --map-root-user, which
      # Ubuntu 24.04's AppArmor denies to unprivileged users by default.
      - name: Allow user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # No flakehub-cache: the image's store paths are sparse disks, tens of GB as NARs.
      - uses: DeterminateSystems/determinate-nix-action@v3

      - name: Build
        env:
          PROFILE: ${{ matrix.profile }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          nix build -L --impure --expr \
            "(builtins.getFlake (toString ./.)).lib.releaseFiles { device = \"$PROFILE\"; version = \"${TAG#v}\"; }"
          mkdir dist && cp -L result/* dist/

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.profile }}
          path: dist/
          compression-level: 0
          retention-days: 3

  publish:
    name: Sign and publish
    needs: [prepare, images]
    if: ${{ !cancelled() && needs.images.result == 'success' }}
    runs-on: ubuntu-latest
    # Holds RELEASE_SIGNING_KEY; see "Phase 4" in the A/B image updates design spec.
    environment: release-signing
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Sign SHA256SUMS
        env:
          SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          cd dist
          sha256sum -- * > SHA256SUMS
          GNUPGHOME="$(mktemp -d)"
          export GNUPGHOME
          gpg --batch --import <<<"$SIGNING_KEY"
          gpg --batch --detach-sign --output SHA256SUMS.gpg SHA256SUMS
          # Images trust only keys/release.pgp: never publish what they would refuse.
          gpgv --keyring "$GITHUB_WORKSPACE/keys/release.pgp" SHA256SUMS.gpg SHA256SUMS

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ needs.prepare.outputs.tag }}
          generate_release_notes: true
          files: dist/*
          # A prerelease is never Latest, so devices never see it.
          prerelease: ${{ contains(needs.prepare.outputs.tag, '-') }}
          make_latest: ${{ !contains(needs.prepare.outputs.tag, '-') }}
