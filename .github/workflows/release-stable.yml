name: Release (Stable)

# Every tag is published as a prerelease candidate, once every profile's image
# is built and SHA256SUMS is signed, and copied to the rolling beta release
# (devices on beta follow releases/download/beta/). The Promote workflow marks
# one Latest: devices on stable follow releases/latest/download/.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to cut, with or without leading v (e.g. 0.2.0)"
        required: true
        type: string
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  cut:
    name: Cut release (dispatch)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.validate.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 0

      - name: Validate version
        id: validate
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="${INPUT_VERSION#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must be semver X.Y.Z (got '$INPUT_VERSION')"; exit 1
          fi
          latest="$(git tag --list 'v[0-9]*' --sort=-v:refname | head -n1)"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "::error::Tag v$version already exists"; exit 1
          fi
          if ! [ "$(printf '%s\n' "$latest" "v$version" | sort -V | tail -n1)" = "v$version" ] \
             || [ "$latest" = "v$version" ]; then
            echo "::error::v$version must be greater than latest tag ${latest:-<none>}"; exit 1
          fi
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      # A tag pushed with GITHUB_TOKEN starts no workflow: this run goes on to build it.
      - name: Tag master HEAD
        env:
          TAG: ${{ steps.validate.outputs.tag }}
        run: |
          git tag "$TAG"
          git push origin "$TAG"

  prepare:
    name: Tag and profiles
    needs: cut
    # cut is skipped on a tag push; a skipped need would skip this job too.
    if: ${{ !cancelled() && (github.event_name == 'push' || needs.cut.result == 'success') }}
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      profiles: ${{ steps.profiles.outputs.profiles }}
    steps:
      - id: tag
        env:
          TAG: ${{ needs.cut.outputs.tag || github.ref_name }}
        run: echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # A tag with - sorts above its release, in sort -V and in systemd: only plain X.Y.Z.
      - name: Validate tag
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag must be vX.Y.Z (got '$TAG')"; exit 1
          fi

      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.tag.outputs.tag }}

      # Every profile under hw/ ships; the image-profiles check builds them all.
      - id: profiles
        run: echo "profiles=$(find hw -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort | jq -Rsc 'split("\n")[:-1]')" >> "$GITHUB_OUTPUT"

  images:
    name: Image (${{ matrix.profile }})
    needs: prepare
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        profile: ${{ fromJSON(needs.prepare.outputs.profiles) }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      # image.repart runs systemd-repart under unshare --map-root-user, which
      # Ubuntu 24.04's AppArmor denies to unprivileged users by default.
      - name: Allow user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # No flakehub-cache: the image's store paths are sparse disks, tens of GB as NARs.
      - uses: DeterminateSystems/determinate-nix-action@v3

      - name: Build
        env:
          PROFILE: ${{ matrix.profile }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          nix build -L --impure --expr \
            "(builtins.getFlake (toString ./.)).lib.releaseFiles { device = \"$PROFILE\"; version = \"${TAG#v}\"; }"
          mkdir dist && cp -L result/* dist/

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.profile }}
          path: dist/
          compression-level: 0
          retention-days: 3

  publish:
    name: Sign and publish
    needs: [prepare, images]
    if: ${{ !cancelled() && needs.images.result == 'success' }}
    runs-on: ubuntu-latest
    # Holds RELEASE_SIGNING_KEY; see "Phase 4" in the A/B image updates design spec.
    environment: release-signing
    # Overlapping copies to beta could leave its SHA256SUMS and signature from different candidates.
    concurrency:
      group: beta-channel
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Refuse files GitHub would refuse
        run: |
          big="$(find dist -type f -size +2147483647c)"
          if [ -n "$big" ]; then
            echo "::error::GitHub refuses release files of 2 GiB or more: ${big//$'\n'/ }"; exit 1
          fi

      - name: Sign SHA256SUMS
        env:
          SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          cd dist
          sha256sum -- * > SHA256SUMS
          GNUPGHOME="$(mktemp -d)"
          export GNUPGHOME
          gpg --batch --import <<<"$SIGNING_KEY"
          gpg --batch --detach-sign --output SHA256SUMS.gpg SHA256SUMS
          # Images trust only keys/release.pgp: never publish what they would refuse.
          gpgv --keyring "$GITHUB_WORKSPACE/keys/release.pgp" SHA256SUMS.gpg SHA256SUMS

      # A re-run for a promoted release would mark it a prerelease again and demote Latest.
      - name: Promoted already?
        id: promoted
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: echo "promoted=$(gh release view "$TAG" --json isDraft,isPrerelease --jq '.isDraft or .isPrerelease | not' 2>/dev/null || echo false)" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        if: steps.promoted.outputs.promoted != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ needs.prepare.outputs.tag }}
          generate_release_notes: true
          files: dist/*
          # Promote marks it Latest, once someone has tried it on beta.
          prerelease: true
          make_latest: false

      # Candidates reach beta in tag order: a re-run of an older tag leaves it be.
      # A re-run of the same tag copies again: a failed copy leaves its .efi
      # files on beta, but not the sums that name them. The images go first and the signed sums last, so that beta's SHA256SUMS
      # never names a file that is not there yet.
      - name: Copy to beta
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          old=""
          if gh release view beta >/dev/null 2>&1; then
            old="$(gh release view beta --json assets --jq '.assets[].name')"
            held="$(sed -n 's/^librepod-[^_]*_\(.*\)\.efi$/\1/p' <<<"$old" | sort -V | tail -n1)"
            if [ -n "$held" ] && [ "$held" != "${TAG#v}" ] \
               && [ "$(printf '%s\n' "$held" "${TAG#v}" | sort -V | tail -n1)" = "$held" ]; then
              echo "beta holds $held, above ${TAG#v}: left as it is"; exit 0
            fi
          else
            gh release create beta --prerelease --latest=false --title beta \
              --target "$(git rev-parse HEAD)" --notes "Rolling beta channel"
          fi

          imgs=(dist/*.efi dist/*.store.raw.zst)
          sums=(dist/SHA256SUMS dist/SHA256SUMS.gpg)
          gh release upload beta "${imgs[@]}" --clobber
          gh release upload beta "${sums[@]}" --clobber

          keep="$(basename -a "${imgs[@]}" "${sums[@]}")"
          while IFS= read -r a; do
            [ -z "$a" ] || grep -qxF "$a" <<<"$keep" || gh release delete-asset beta "$a" -y </dev/null
          done <<<"$old"

          gh release edit beta --notes "Candidate $TAG"
          git push -f origin "HEAD:refs/tags/beta"
