name: Updates E2E

# Manual only: about an hour per run. Pick the branch or tag to test under
# Actions → Updates E2E → Run workflow. Releases do not wait for it.
on:
  workflow_dispatch:

permissions:
  id-token: write # flakehub-cache
  contents: read

jobs:
  e2e:
    name: Update path (updates-e2e)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # The VM test needs KVM; the build sandbox reaches it as a nixbld user.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -w /dev/kvm || { echo "::error::runner has no usable /dev/kvm"; exit 1; }

      - uses: DeterminateSystems/determinate-nix-action@v3
        with:
          flakehub-cache: true

      - run: nix build .#updates-e2e -L
