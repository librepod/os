---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: devices.os.librepod.org
spec:
  group: os.librepod.org
  names:
    kind: Device
    listKind: DeviceList
    plural: devices
    shortNames:
    - dev
    singular: device
  scope: Cluster
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              DeviceSpec holds the owner's answers. Each section is acted on once, when
              its rev/id is above status.handled.<section>.
            properties:
              install:
                properties:
                  id:
                    format: int64
                    maximum: 999999999999999
                    minimum: 1
                    type: integer
                  when:
                    enum:
                    - now
                    - tonight
                    type: string
                required:
                - id
                - when
                type: object
              power:
                properties:
                  action:
                    enum:
                    - reboot
                    - poweroff
                    type: string
                  id:
                    format: int64
                    maximum: 999999999999999
                    minimum: 1
                    type: integer
                required:
                - action
                - id
                type: object
              sshKeys:
                properties:
                  keys:
                    items:
                      maxLength: 8192
                      pattern: ^[a-z0-9@.-]+ AAAA[A-Za-z0-9+/]+={0,3}( [^\r\n]*)?$
                      type: string
                    maxItems: 32
                    type: array
                  rev:
                    format: int64
                    maximum: 999999999999999
                    minimum: 1
                    type: integer
                required:
                - keys
                - rev
                type: object
              updates:
                properties:
                  auto:
                    type: boolean
                  channel:
                    enum:
                    - stable
                    - beta
                    type: string
                  rev:
                    format: int64
                    maximum: 999999999999999
                    minimum: 1
                    type: integer
                  timezone:
                    maxLength: 64
                    pattern: ^[A-Za-z][A-Za-z0-9_+-]*(/[A-Za-z0-9_+-]+)*$
                    type: string
                required:
                - auto
                - channel
                - rev
                - timezone
                type: object
            type: object
          status:
            properties:
              handled:
                description: Handled is the last number acted on, per section.
                properties:
                  install:
                    format: int64
                    type: integer
                  power:
                    format: int64
                    type: integer
                  sshKeys:
                    format: int64
                    type: integer
                  updates:
                    format: int64
                    type: integer
                required:
                - install
                - power
                - sshKeys
                - updates
                type: object
              rejected:
                additionalProperties:
                  type: string
                type: object
              setupCodeHash:
                type: string
              sshKeys:
                items:
                  type: string
                type: array
              system:
                properties:
                  dataDisk:
                    properties:
                      present:
                        type: boolean
                      sizeBytes:
                        format: int64
                        type: integer
                      usedBytes:
                        format: int64
                        type: integer
                    required:
                    - present
                    type: object
                  rootDisk:
                    properties:
                      sizeBytes:
                        format: int64
                        type: integer
                      usedBytes:
                        format: int64
                        type: integer
                    required:
                    - sizeBytes
                    - usedBytes
                    type: object
                  version:
                    type: string
                required:
                - dataDisk
                - rootDisk
                - version
                type: object
              update:
                description: 'Update is the updater''s status.json, verbatim: the
                  updater owns its schema.'
                type: object
                x-kubernetes-preserve-unknown-fields: true
              updated:
                format: date-time
                type: string
            required:
            - handled
            - sshKeys
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
